[project]
name = "crypto-signals-with-grok-bot"
version = "0.1.0"
description = "time@mode crypto signal scanner, API, and alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.0,<3",
    "fastapi>=0.115",
    "httpx>=0.27",
    "motor>=3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
scanner = ["numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests", "Core", "Repositories"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "Core", "Repositories", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "Core", "Repositories"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "Core*", "Repositories*"]
